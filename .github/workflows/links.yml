name: links
on:
  schedule: [{ cron: '23 3 * * 1' }]
  workflow_dispatch: {}
permissions: { contents: read, issues: write }
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci && npm run build
      - id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Only external http(s) links are checked. Internal links are root-relative ("/about"); lychee must be told
          # where the root is to resolve them before the scheme filter can skip them, or each one is reported as an error.
          # The site's own generated self-references (canonical, og:image) are skipped: the e2e suite already checks
          # them, and content links between pages are root-relative.
          # 403 counts as alive: sacred-texts.com and britannica.com answer non-browser clients with 403, while a page
          # that has really gone usually returns 404 or 410.
          # sacred-texts.com is excluded outright: its bot challenge breaks automated HTTP/2 requests ("protocol error"),
          # so lychee can't tell live from dead there. Check those "Read the text" links by hand in a browser.
          args: >-
            --no-progress --max-concurrency 4 --scheme https --scheme http --accept 200,206,403,429
            --root-dir '${{ github.workspace }}/dist'
            --exclude '^https://sastras\.dhanjit\.me(/|$)' --exclude '^https://(www\.)?sacred-texts\.com/'
            --exclude-path dist/og 'dist/**/*.html'
          output: lychee/out.md
          fail: false
      # Everything resolves again: close the open issue, so an open one always means "still failing".
      - if: steps.lychee.outputs.exit_code == 0
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          n=$(gh issue list --repo '${{ github.repository }}' --label links --state open --json number -q '.[0].number')
          [ -z "$n" ] || gh issue close "$n" --repo '${{ github.repository }}' --comment "All external links resolve: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - id: existing
        if: steps.lychee.outputs.exit_code != 0
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          n=$(gh issue list --repo '${{ github.repository }}' --label links --state open --json number -q '.[0].number')
          echo "number=$n" >> "$GITHUB_OUTPUT"
      - if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Dead source links
          content-filepath: lychee/out.md
          labels: links
          issue-number: ${{ steps.existing.outputs.number }}
      # Editing an issue's body notifies nobody; a comment does.
      - if: steps.lychee.outputs.exit_code != 0 && steps.existing.outputs.number != ''
        env: { GH_TOKEN: '${{ github.token }}', ISSUE: '${{ steps.existing.outputs.number }}' }
        run: |
          gh issue comment "$ISSUE" --repo '${{ github.repository }}' --body "Still failing or newly failing links: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
