name: links
on:
  schedule: [{ cron: '0 3 * * 1' }]
  workflow_dispatch: {}
permissions: { contents: read, issues: write }
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci && npm run build
      - id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Only external http(s) links are checked. Internal links are root-relative ("/about"); lychee must be told
          # where the root is to resolve them before the scheme filter can skip them, or each one is reported as an error.
          # The site's own canonical and og:image URLs are not sources; skip them too, so a site that is not live yet
          # (or a blip on our own host) does not open a "dead source links" issue.
          args: >-
            --no-progress --max-concurrency 4 --scheme https --scheme http --accept 200,206,429
            --root-dir '${{ github.workspace }}/dist'
            --exclude '^https://sastras\.dhanjit\.me(/|$)' --exclude-path dist/og 'dist/**/*.html'
          output: lychee/out.md
          fail: false
      - id: existing
        if: steps.lychee.outputs.exit_code != 0
        env: { GH_TOKEN: '${{ github.token }}' }
        run: echo "number=$(gh issue list --repo '${{ github.repository }}' --label links --state open --json number -q '.[0].number')" >> "$GITHUB_OUTPUT"
      - if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Dead source links
          content-filepath: lychee/out.md
          labels: links
          issue-number: ${{ steps.existing.outputs.number }}
