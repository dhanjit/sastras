<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 50 360 130">
  <title>The rope mistaken for a snake</title>
  <desc>A coiled rope lies on the ground, one end trailing out to the right. In the animation the drawing starts faint, as if barely seen: the trailing end carries a snake's head with a flicking forked tongue, and a label reads “a snake”. Then the drawing comes into full view: the head and tongue fade, the rope's twisted strands and frayed end appear, the label “a snake” is struck through, and a label “the rope” appears under the coil. The still picture shows that end state: only the rope, with “a snake” struck through.</desc>
  <style>
    #fig-maya-rope-snake .rope { stroke-width: 6.5; stroke-linecap: round; }
    #fig-maya-rope-snake .twist { fill: none; stroke: var(--leaf); stroke-width: 1.3; }
    #fig-maya-rope-snake .scene { animation: maya-rope-snake--light 0.8s ease-in-out 1s 1 both; }
    #fig-maya-rope-snake .detail { animation: maya-rope-snake--show 0.7s ease-in-out 1.1s 1 both; }
    #fig-maya-rope-snake .snake { opacity: 0; animation: maya-rope-snake--hide 0.6s ease-in 1.1s 1 both; }
    #fig-maya-rope-snake .tongue { transform-box: fill-box; transform-origin: 0% 50%; animation: maya-rope-snake--flick 0.9s linear 0.1s 1 both; }
    #fig-maya-rope-snake .was { animation: maya-rope-snake--was 0.4s ease-out 1.5s 1 both; }
    #fig-maya-rope-snake .strike { stroke-width: 1.2; transform-box: fill-box; transform-origin: 0% 50%; animation: maya-rope-snake--strike 0.35s ease-out 1.6s 1 both; }
    #fig-maya-rope-snake .is { animation: maya-rope-snake--show 0.4s ease-out 1.6s 1 both; }
    @keyframes maya-rope-snake--light { from { opacity: 0.4; } }
    @keyframes maya-rope-snake--show { from { opacity: 0; } }
    @keyframes maya-rope-snake--hide { from { opacity: 1; } }
    @keyframes maya-rope-snake--flick { 0%, 40%, 80%, 100% { transform: scaleX(0); } 20%, 60% { transform: scaleX(1); } }
    @keyframes maya-rope-snake--was { from { fill: var(--rubric); } }
    @keyframes maya-rope-snake--strike { from { transform: scaleX(0); } }
  </style>

